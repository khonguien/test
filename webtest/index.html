<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mở Lì Xì May Mắn</title>
    <style>
        /* --- CẤU HÌNH CHUNG --- */
        :root {
            --envelope-width: 300px;
            --envelope-height: 180px;
            --envelope-color: #d32f2f; /* Màu đỏ lì xì */
            --flap-color: #c62828;     /* Màu nắp lì xì (đậm hơn chút) */
            --bg-color: #ffebee;       /* Màu nền trang web */
            --anim-speed: 0.5s;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-color);
            margin: 0;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        /* --- BAO LÌ XÌ (CONTAINER) --- */
        .envelope-wrapper {
            position: relative;
            width: var(--envelope-width);
            height: var(--envelope-height);
            cursor: pointer;
            /* Hiệu ứng rung nhẹ mời gọi */
            animation: float 3s ease-in-out infinite;
        }

        /* Phần thân bao lì xì */
        .envelope-body {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            background-color: var(--envelope-color);
            border-radius: 0 0 10px 10px;
            z-index: 10;
            /* Đổ bóng cho có chiều sâu */
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            
            /* [TÙY CHỈNH] Thay background-image ở đây nếu muốn dùng ảnh thiết kế riêng */
            /* background-image: url('link-anh-than-bao.jpg'); background-size: cover; */
        }

        /* Nắp bao lì xì */
        .envelope-flap {
            position: absolute;
            top: 0;
            width: 100%;
            height: 100%; /* Chiều cao bằng thân để gập xuống */
            background-color: var(--flap-color);
            clip-path: polygon(0 0, 50% 50%, 100% 0); /* Tạo hình tam giác nắp */
            transform-origin: top;
            transition: transform var(--anim-speed) ease-in-out, z-index var(--anim-speed);
            z-index: 20; /* Ban đầu nắp nằm trên cùng */

             /* [TÙY CHỈNH] Thay background-image ở đây */
        }

        /* Phần bên trong (giả làm mặt sau của bao) */
        .envelope-pocket {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            background-color: #b71c1c; /* Màu tối hơn bên trong */
            border-radius: 0 0 10px 10px;
            z-index: 1;
        }

        /* --- NỘI DUNG LÌ XÌ (TỜ TIỀN / LỜI CHÚC) --- */
        .content-card {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            height: 90%;
            background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: bottom var(--anim-speed) ease-in-out;
            z-index: 5; /* Nằm giữa túi và thân trước */
            padding: 20px;
            box-sizing: border-box;
            border: 2px solid #ffca28;
            
            /* [TÙY CHỈNH] Thay ảnh tờ tiền hoặc lời chúc ở đây */
            /* background-image: url('link-anh-to-tien.jpg'); background-size: cover; */
        }

        .content-card h2 {
            margin: 0;
            color: #d32f2f;
            font-size: 1.5rem;
        }

        .content-card p {
            color: #555;
            font-size: 1rem;
        }

        /* Nút đóng (X) */
        .close-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: #aaa;
            display: none; /* Ẩn khi chưa mở */
        }

        /* --- TRẠNG THÁI MỞ (OPEN STATE) --- */
        
        /* 1. Nắp lật lên */
        .envelope-wrapper.open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 1; /* Sau khi lật, nắp chui xuống dưới content */
        }

        /* 2. Nội dung trồi lên */
        .envelope-wrapper.open .content-card {
            bottom: 120px; /* Đẩy lên cao khỏi bao */
            z-index: 30; /* Trồi lên trên cùng để dễ đọc */
            transition-delay: 0.2s; /* Đợi nắp mở xíu rồi mới lên */
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* 3. Hiện nút đóng */
        .envelope-wrapper.open .close-btn {
            display: block;
        }

        /* Animation rung rinh */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

    </style>
</head>
<body>

    <div class="envelope-wrapper" id="envelope" onclick="toggleEnvelope()">
        
        <div class="envelope-flap"></div>
        
        <div class="envelope-pocket"></div>

        <div class="content-card" id="content">
            <button class="close-btn" onclick="closeEnvelope(event)">✖</button>
            <h2>Chúc Mừng Năm Mới!</h2>
            <p>Vạn sự như ý - Tỷ sự như mơ</p>
            <p style="font-weight: bold; margin-top: 10px; color: #ff6f00;">500.000 VNĐ</p>
        </div>

        <div class="envelope-body"></div>
    </div>

    <script>
        const envelope = document.getElementById('envelope');

        function toggleEnvelope() {
            // Thêm hoặc bỏ class 'open' để kích hoạt CSS
            envelope.classList.add('open');
        }

        function closeEnvelope(event) {
            // Ngăn sự kiện click lan ra ngoài (để không kích hoạt toggleEnvelope lại ngay lập tức)
            event.stopPropagation();
            envelope.classList.remove('open');
        }
    </script>

</body>
</html>
